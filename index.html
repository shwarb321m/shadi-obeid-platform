<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d3b33">
<title>منصة الأستاذ شادي عبيد — الرياضيات والفيزياء</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#fbfaf6,#0e1412);--ink:light-dark(#14201c,#e8eee9);--muted:light-dark(#5b6964,#9eb0a8);--card:light-dark(#ffffff,#161f1c);--line:light-dark(#e4e1d7,#2a3632);--soft:light-dark(#f2f0e8,#1b2522);--brand:light-dark(#1d3b33,#f5b83d);--board:#1d3b33;--chalk:#f3f0e6;--acc:#f5b83d;--acc-ink:#2a1d00;--ok:light-dark(#1f7a4d,#5fd39a);--warn:light-dark(#8a4f00,#f5b83d);--bad:light-dark(#b42318,#ff8a80)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;overflow-x:clip;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
body.noscroll{overflow:hidden}
h1,h2,h3,h4{font-family:'Readex Pro','IBM Plex Sans Arabic',sans-serif;line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,4.2vw,48px);font-weight:700}
h2{font-size:clamp(26px,3vw,36px)}
h3{font-size:19px}
p{margin:0}
img{max-width:100%}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1240px;margin-inline:auto}
.band{padding-block:clamp(32px,5vw,72px);padding-inline:max(5vw,16px)}
.demo{background:#0c1714;color:#e9e5d8;padding:8px max(5vw,16px);font-size:14px}
.demoin{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.seg{display:flex;background:#1d2b27;border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:#cfd8d3;border-radius:999px;padding:8px 14px;min-height:38px;cursor:pointer;font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--acc-ink)}
.badge{background:#e5484d;color:#fff;border-radius:999px;font-size:12px;padding:0 7px;line-height:20px;min-width:20px;text-align:center}
.badge:empty{display:none}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-inline:max(5vw,16px)}
.topin{display:flex;align-items:center;gap:16px;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand b{display:block;font-family:'Readex Pro',sans-serif;font-size:17px;line-height:1.2}
.brand small{color:var(--muted);font-size:13px}
.mark{width:42px;height:42px;border-radius:12px;background:var(--board);color:var(--acc);display:grid;place-items:center;font:700 22px 'Readex Pro',sans-serif;flex:none}
.nav{display:flex;gap:4px;margin-inline-start:auto}
.nav a{text-decoration:none;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:500}
.nav a:hover{color:var(--ink);background:var(--soft)}
.acct{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;background:var(--acc);color:var(--acc-ink);font-weight:700;padding:12px 20px;min-height:46px;cursor:pointer;text-decoration:none;transition:transform .15s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn:disabled{opacity:.55;pointer-events:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:3px solid color-mix(in srgb,var(--acc) 70%,transparent);outline-offset:2px}
.btn.sm{padding:8px 14px;min-height:40px;font-size:14px;border-radius:10px}
.btn.xs{padding:4px 10px;min-height:32px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.chalk{background:transparent;color:var(--chalk);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--chalk) 45%,transparent)}
.btn.link{background:none;color:var(--muted);padding:6px 8px;min-height:auto;box-shadow:none}
.btn.danger{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.btn.full{width:100%}
.btn.wa{background:#25d366;color:#04230f}
.btn.okb{background:var(--ok);color:light-dark(#fff,#04230f)}
.btn svg,.ib svg{width:18px;height:18px;flex:none}
.board{background:var(--board);color:var(--chalk);background-image:radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.07),transparent 55%),radial-gradient(ellipse at 90% 100%,rgba(0,0,0,.25),transparent 60%)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(24px,4vw,56px);align-items:center}
.htxt p{font-size:18px;margin-top:16px;color:color-mix(in srgb,var(--chalk) 82%,transparent);max-width:34em}
.ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.facts{list-style:none;margin:28px 0 0;display:flex;gap:28px;flex-wrap:wrap;border-top:1px dashed color-mix(in srgb,var(--chalk) 30%,transparent);padding:18px 0 0}
.facts b{display:block;font:700 30px/1 'Readex Pro',sans-serif;color:var(--acc)}
.facts li{font-size:15px}
.hpic svg{width:100%;height:auto;display:block}
.sechead{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.tabs{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:14px;flex-wrap:wrap}
.tabs button{white-space:nowrap;border:0;background:none;padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted);min-height:42px;display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tabs button .cnt{font-size:12px;background:var(--line);border-radius:999px;padding:0 7px}
.note{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:color-mix(in srgb,var(--acc) 16%,var(--card));margin-bottom:22px;font-weight:500}
.note.ok{background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.note.bad{background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--bad)}
.note>svg{width:20px;height:20px;flex:none}
.note .btn{margin-inline-start:auto}
.prog-bar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.prog-track{flex:1;min-width:180px;height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
.prog-fill{height:100%;background:var(--ok);border-radius:999px;transition:width .3s}
.units{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.unit{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.unit h3{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;font-size:18px}
.unit h3 span{font-size:13px;color:var(--muted);font-weight:500}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;text-align:start;background:none;border:0;border-top:1px solid var(--line);padding:12px 4px;cursor:pointer;border-radius:0}
.lrow:hover .num{transform:scale(1.07)}
.num{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--board);color:var(--acc);transition:transform .15s;position:relative}
.num svg{width:16px;height:16px}
.num.done-c{background:var(--ok);color:#fff}
.lrow.locked .num{background:var(--soft);color:var(--muted)}
.lt b{display:flex;align-items:center;gap:6px;font-weight:600;flex-wrap:wrap}
.lt small{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px}
.lrow.locked .lt b{color:var(--muted)}
.tag{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.tag.free{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.tag.open{background:color-mix(in srgb,var(--acc) 24%,transparent);color:var(--warn)}
.tag.lk{background:var(--soft);color:var(--muted)}
.tag.pdf{background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);font-size:11px;padding:1px 7px}
.soft{background:var(--soft)}
.lead{color:var(--muted);margin:8px 0 24px;font-size:17px}
.plans{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.plan{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:6px}
.plan.best{background:var(--board);color:var(--chalk);border-color:var(--board)}
.ribbon{position:absolute;top:16px;inset-inline-end:16px;background:var(--acc);color:var(--acc-ink);font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px}
.psub{color:var(--muted)}
.plan.best .psub{color:color-mix(in srgb,var(--chalk) 70%,transparent)}
.price{margin:8px 0}
.price b{font:700 44px/1 'Readex Pro',sans-serif}
.plan ul{padding-inline-start:18px;margin:4px 0 18px;font-size:15px;flex:1}
.plan li{margin-bottom:4px}
.small{font-size:13px;color:var(--muted);margin-top:14px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:24px}
.stp{border-top:3px solid var(--brand);padding-top:16px}
.si{width:48px;height:48px;border-radius:14px;background:var(--soft);display:grid;place-items:center;color:var(--brand);margin-bottom:12px}
.si svg{width:24px;height:24px}
.stp h3{margin-bottom:6px}
.stp p{color:var(--muted)}
.foot{padding:28px max(5vw,16px)}
.footin{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:end}
.foot .small{color:color-mix(in srgb,var(--chalk) 65%,transparent);margin:0}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,12,10,.68);display:grid;place-items:center;padding:16px;overflow:auto}
.modal[hidden]{display:none}
.dlg{position:relative;background:var(--card);color:var(--ink);border-radius:20px;width:min(540px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:26px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:pop .2s ease-out}
.dlg.wide{width:min(920px,100%)}
@keyframes pop{from{transform:translateY(10px);opacity:0}}
.x{position:absolute;top:10px;inset-inline-end:10px;width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);font-size:22px;cursor:pointer;line-height:1;z-index:2}
.dlg h3{font-size:22px;margin-bottom:14px;padding-inline-end:40px}
.form{display:grid;gap:14px}
.form label,.inl{display:grid;gap:6px;font-weight:600;font-size:15px}
input,select{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px;min-height:46px;width:100%}
.err{color:var(--bad);font-size:14px;min-height:1em}
.switch{text-align:center;color:var(--muted);font-size:15px}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.row2>*{flex:1}
.mhead{text-align:center;margin-bottom:18px}
.mhead p{color:var(--muted)}
.mhead h3{padding:0;margin:12px 0 6px}
.cic{width:64px;height:64px;border-radius:50%;background:var(--soft);display:grid;place-items:center;margin:0 auto;color:var(--muted)}
.cic svg{width:28px;height:28px}
.cic.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.step{font-weight:700;margin:16px 0 8px}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pk{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;text-align:start;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:52px}
.pk b{font-size:14px;font-weight:600}
.pk span{font-weight:700;white-space:nowrap}
.pk[aria-pressed=true]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--bg))}
.inl{margin-top:10px}
.tabs.sm button{font-size:14px;padding:8px 10px;flex:1}
.pbody{margin-top:14px;display:grid;gap:12px}
.wallets{display:grid;gap:8px}
.wl{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer}
.wl input{width:18px;height:18px;min-height:0;accent-color:var(--board);flex:none}
.wl>span{flex:1;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.drop{border:2px dashed var(--line);border-radius:14px;min-height:110px;display:grid;place-items:center;gap:6px;cursor:pointer;color:var(--muted);text-align:center;padding:12px}
.drop img{max-height:200px;border-radius:8px}
.drop svg{width:28px;height:28px}
.done{text-align:center}
.done p{color:var(--muted);margin-bottom:16px}
.tip{background:color-mix(in srgb,var(--acc) 16%,var(--card));border-radius:12px;padding:12px;font-size:14px;margin-bottom:14px;text-align:start}
.subs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
.sb{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid}
.sb span{font-size:14px;color:var(--muted)}
.sb.on{border-color:var(--ok)}
.sb.on span{color:var(--ok)}
.rq{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px;align-items:center}
.st{font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.st.pending{background:color-mix(in srgb,var(--acc) 24%,transparent);color:var(--warn)}
.st.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.st.no{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
h4{margin:16px 0 6px}
.muted{color:var(--muted)}

/* مشغل الفيديو المحمي بطبقة العزل والعلامة المائية */
.player{display:grid;gap:12px}
.scr{position:relative;aspect-ratio:16/9;background:var(--board);background-image:radial-gradient(ellipse at 30% 10%,rgba(255,255,255,.08),transparent 60%);border-radius:14px;overflow:hidden;color:var(--chalk);display:grid;place-content:center;text-align:center;gap:8px;padding:20px;border:8px solid #7a4f27;cursor:pointer;user-select:none}
.scr:fullscreen,.scr:-webkit-full-screen{border-width:4px;border-radius:0;width:100vw;height:100vh}
.scr iframe,.scr video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;z-index:1}
/* تكبير طفيف لإخفاء حواف وشعارات يوتيوب تماماً */
.scr iframe.yt-frame{width:100%;height:118%;top:-9%;left:0;pointer-events:none}
/* طبقة عزل شفافة تمنع النقر على أزرار يوتيوب أو المشاركة أو الزر الأيمن */
.v-shield{position:absolute;inset:0;z-index:3;background:transparent;cursor:pointer}
/* طبقة عزل زر فتح نافذة خارجية في Google Drive */
.drive-shield{position:absolute;top:0;left:0;right:0;height:64px;z-index:4;background:transparent}
/* العلامة المائية الديناميكية المحمية ضد الحذف */
.wm{position:absolute;z-index:6;font-size:13px;font-weight:700;color:rgba(255,255,255,.46);background:rgba(0,0,0,.22);padding:2px 9px;border-radius:6px;transform:rotate(-8deg);white-space:nowrap;transition:top 1.4s ease,left 1.4s ease;pointer-events:none;top:18%;left:12%;text-shadow:0 1px 2px rgba(0,0,0,.8);letter-spacing:.02em}
.wm-ghost{position:absolute;z-index:6;font-size:11px;font-weight:700;color:rgba(245,184,61,.32);pointer-events:none;bottom:14%;right:16%;font-family:ui-monospace,Consolas,monospace}
/* ضبابية الأمان عند فقدان التركيز أو محاولة تصوير الشاشة */
.scr.blurred>*:not(.sec-overlay){filter:blur(18px)!important}
.sec-overlay{position:absolute;inset:0;z-index:8;background:rgba(12,23,20,.92);color:#fff;display:none;place-content:center;text-align:center;padding:24px;gap:10px}
.scr.blurred .sec-overlay,.scr.tampered .sec-overlay{display:grid}
.sc-u{font-size:14px;opacity:.7;position:relative;z-index:2}
.sc-t{font:700 clamp(22px,4vw,36px) 'Readex Pro',sans-serif;position:relative;z-index:2}
.sc-f{font:700 clamp(26px,5vw,48px) 'Caveat',cursive;color:#fff3c9;clip-path:inset(0 100% 0 0);animation:write 2.4s .4s ease forwards;position:relative;z-index:2}
@keyframes write{to{clip-path:inset(0 0 0 0)}}
.bigp{position:absolute;z-index:5;top:50%;left:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:opacity .2s;pointer-events:none}
.bigp svg{width:30px;height:30px}
.scr.on .bigp{opacity:0}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ib{height:42px;min-width:42px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--soft);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.ib:hover{background:var(--line)}
#prog{direction:ltr;flex:1;min-width:120px;accent-color:var(--acc);min-height:0;padding:0;border:0;background:none}
.tm{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);white-space:nowrap}
.pinfo{display:flex;justify-content:space-between;align-items:start;gap:12px;flex-wrap:wrap}
.pinfo h3{margin-bottom:4px}
.pinfo p{color:var(--muted);font-size:14px}
.sec-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);padding:4px 10px;border-radius:999px;font-weight:600}
.big{width:100%;border-radius:12px;display:block}

/* لوحة تحكم الأستاذ */
.adm{padding:clamp(24px,4vw,48px) max(5vw,16px);min-height:70vh}
.ahead{margin-bottom:18px;display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.ahead h1{font-size:clamp(26px,3vw,36px)}
.adm-t{margin-bottom:20px;flex-wrap:nowrap;overflow-x:auto}
.adm-t button{white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat span{color:var(--muted);font-size:14px}
.stat b{display:block;font:700 34px/1.1 'Readex Pro',sans-serif;margin-top:6px;white-space:nowrap}
.stat.hl{background:var(--board);color:var(--chalk);border-color:var(--board)}
.stat.hl span{color:color-mix(in srgb,var(--chalk) 70%,transparent)}
.stat.hl b{color:var(--acc)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.panel h3{margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.bar i{display:block;height:12px;border-radius:6px;background:var(--brand)}
.bar em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.rlist{display:grid;gap:12px}
.rcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.thumb{width:72px;height:96px;border:1px solid var(--line);border-radius:10px;overflow:hidden;padding:0;cursor:zoom-in;background:var(--soft)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.rinfo{display:grid;font-size:14px;gap:2px}
.rinfo b{font-size:16px}
.ramt{display:grid;gap:8px;justify-items:end}

/**
 * توليد بصمة رقمية فريدة وثابتة لجهاز ومتصفح الطالب (Device Fingerprint)

function getDeviceFingerprint() {
  let fp = localStorage.getItem(DEVICE_KEY);
  if (fp) return fp;
  const nav = window.navigator || {};
  const scr = window.screen || {};
  const raw = [
    nav.userAgent || '',
    nav.language || '',
    nav.hardwareConcurrency || '',
    scr.width + 'x' + scr.height,
    scr.colorDepth || '',
    Intl.DateTimeFormat().resolvedOptions().timeZone || ''
  ].join('|');
  let hash = 2166136261;
  for (let i = 0; i < raw.length; i++) {
    hash ^= raw.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  const rand = Math.random().toString(36).substring(2, 8).toUpperCase();
  fp = 'DEV-' + (hash >>> 0).toString(16).toUpperCase() + '-' + rand;
  localStorage.setItem(DEVICE_KEY, fp);
  return fp;
}

  const ua = navigator.userAgent || '';

/**

async function callGasApi(action, payload = {}) {
  if (!API_URL) return null;
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      action,
      payload,
      auth: { token: S.token, deviceFp: MY_DEVICE_FP }
    })
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'حدث خطأ في الاتصال بالخادم');
  return json.data;
}

/**
 * تحليل رابط الفيديو (YouTube Unlisted أو Google Drive أو مباشر)
 */
function parseVideoUrl(rawUrl) {
  const url = String(rawUrl || '').trim();
  if (!url) return { provider: 'chalkboard', id: '' };
  const yt = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/);
  if (yt || /^[a-zA-Z0-9_-]{11}$/.test(url)) {
    return { provider: 'youtube', id: yt ? yt[1] : url };
  }
  const dr = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if (dr || url.includes('drive.google.com')) {
    return { provider: 'drive', id: dr ? dr[1] : url };
  }
  return { provider: 'direct', id: url };
}

function openM(html, wide) {
  stopPlayerCleanup();
  modal.innerHTML = `<div class="dlg ${wide ? 'wide' : ''}" role="dialog" aria-modal="true"><button type="button" class="x" data-act="close" aria-label="إغلاق">×</button>${html}</div>`;
  modal.hidden = false;
  document.body.classList.add('noscroll');
  const f = modal.querySelector('input:not([type=radio]):not([type=file])');
  if (f && !wide) setTimeout(() => f.focus(), 60);
}

function stopPlayerCleanup() {
  clearInterval(tick);
  clearInterval(wmT);
  if (wmObserver) { wmObserver.disconnect(); wmObserver = null; }
  if (P && S.user && P.lessonId && P.pos > 3) {
    saveLessonProgress(P.lessonId, P.pos, P.pos >= P.dur * 0.85);
  }
  if (ytPlayer && typeof ytPlayer.destroy === 'function') {
    try { ytPlayer.destroy(); } catch (e) {}
  }
  ytPlayer = null;
  P = null;
}

function closeM() {
  stopPlayerCleanup();
  modal.hidden = true;
  modal.innerHTML = '';
  document.body.classList.remove('noscroll');
  render();
}

function saveLessonProgress(lessonId, posSec, isDone) {
  if (!S.user) return;
  const key = S.user.id + '_' + lessonId;
  const prev = S.progress[key] || { pos: 0, done: false };
  S.progress[key] = {
    pos: Math.floor(posSec),
    done: Boolean(prev.done || isDone)
  };
  saveState();
  if (API_URL) {
    callGasApi('lesson.progress', { lessonId, posSec: Math.floor(posSec), completed: Boolean(prev.done || isDone) }).catch(() => {});
  }
}

function playM(k, id) {
  const l = L[k].find(x => x.id === id);
  if (!l) return;
  if (!canWatch(l, k)) return lockedM(k, id);

  l.v++;
  saveState();

  const [mm, ss] = l.d.split(':').map(Number);
  const totalSec = (mm || 10) * 60 + (ss || 0);
  const pr = getLessonProgress(l.id);
  const startPos = (pr && pr.pos > 5 && pr.pos < totalSec - 10) ? pr.pos : 0;

  const who = S.user
    ? `${S.user.name} · ${S.user.phone} · #${S.user.id}`
    : `زائر · درس مجاني · ${MY_DEVICE_FP.slice(0, 10)}`;

  const parsed = parseVideoUrl(l.videoSource);
  let mediaEmbedHtml = '';

  if (parsed.provider === 'youtube' && parsed.id) {
    mediaEmbedHtml = `<div id="ytMount" class="yt-frame"></div><div class="v-shield" data-act="pp" title="اضغط للتشغيل أو الإيقاف المؤقت"></div>`;
  } else if (parsed.provider === 'drive' && parsed.id) {
    const drivePreviewUrl = `https://drive.google.com/file/d/${encodeURIComponent(parsed.id)}/preview`;
    mediaEmbedHtml = `<iframe src="${drivePreviewUrl}" allow="autoplay; encrypted-media" sandbox="allow-scripts allow-same-origin allow-forms"></iframe><div class="drive-shield" title="طبقة حماية المنصة"></div>`;
  } else if (parsed.provider === 'direct' && parsed.id) {
    mediaEmbedHtml = `<video id=" html5Vid" src="${esc(parsed.id)}" playsinline controlslist="nodownload noplaybackrate" disablepictureinpicture></video><div class="v-shield" data-act="pp"></div>`;
  } else {
    // شاشة السبورة التفاعلية الافتراضية عند عدم وضع رابط خارجي بعد
    mediaEmbedHtml = `<div class="sc-u">${SUBJ[k]} · ${esc(l.u)}</div><div class="sc-t">${esc(l.t)}</div><div class="sc-f" dir="ltr">${esc(l.f)}</div><div class="v-shield" data-act="pp"></div>`;
  }

  openM(`<div class="player" oncontextmenu="return false">
    <div class="scr on" id="scr" role="region" aria-label="مشغل الفيديو المحمي">
      ${mediaEmbedHtml}
      <div class="wm" id="wm">${esc(who)}</div>
      <div class="wm-ghost" id="wmGhost">${esc(MY_DEVICE_FP)}</div>
      <div class="bigp">${I.play}</div>
      <div class="sec-overlay" id="secOverlay">
        <div>
          <h3 style="color:var(--acc);margin-bottom:6px">🛡️ وضع حماية المحتوى</h3>
          <p id="secMsg">تم إيقاف الفيديو مؤقتاً لأن النافذة فقدت التركيز أو تم فتح أداة خارجية. اضغط للعودة للمشاهدة.</p>
          <button type="button" class="btn sm" style="margin-top:12px" data-act="resumeSec">متابعة المشاهدة</button>
        </div>
      </div>
    </div>
    <div class="ctl">
      <button type="button" class="ib" data-act="pp" id="ppb" aria-label="إيقاف مؤقت">${I.pause}</button>
      <button type="button" class="ib" data-act="seek" data-d="-10" aria-label="رجوع 10 ثوانٍ" dir="ltr">−10s</button>
      <button type="button" class="ib" data-act="seek" data-d="10" aria-label="تقديم 10 ثوانٍ" dir="ltr">+10s</button>
      <input type="range" id="prog" min="0" max="${totalSec}" value="${startPos}" step="1" aria-label="موضع التشغيل">
      <span class="tm" id="tm" dir="ltr">${fmtT(startPos)} / ${l.d}</span>
      <button type="button" class="ib" data-act="speed" id="spdBtn" title="سرعة التشغيل" dir="ltr">1x</button>
      <button type="button" class="ib" data-act="fs" title="ملء الشاشة مع الحماية">${I.fs}</button>
    </div>
    <div class="pinfo">
      <div>
        <h3>${esc(l.t)}</h3>
        <p>${l.free ? 'درس مجاني متاح للجميع.' : 'درس محمي ضمن اشتراكك.'} العلامة المائية المتحركة مرتبطة ببياناتك وجهازك لمنع التسريب.</p>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        ${l.pdfUrl ? `<a class="btn ghost sm" href="${esc(l.pdfUrl)}" target="_blank" rel="noopener">${I.pdf} ملخص الدرس PDF</a>` : ''}
        <span class="sec-badge">${I.shield} بث معزول ومحمي</span>
      </div>
    </div>
  </div>`, true);

  P = {
    lessonId: l.id,
    subj: k,
    provider: parsed.provider,
    videoId: parsed.id,
    pos: startPos,
    dur: totalSec,
    on: true,
    speed: 1,
    l: l.d,
    wmText: who
  };

  if (startPos > 5) {
    toast(`تم استئناف الدرس من الدقيقة ${fmtT(startPos)}`);
  }

  initMediaController();
  upd();

  // مؤقت تحديث شريط التقدم وحفظ موقع التوقف
  tick = setInterval(() => {
    if (!P || !P.on) return;
    if (P.provider === 'youtube' && ytPlayer && typeof ytPlayer.getCurrentTime === 'function') {
      const cur = ytPlayer.getCurrentTime();
      const dur = ytPlayer.getDuration();
      if (cur > 0) P.pos = cur;
      if (dur > 0) {
        P.dur = Math.floor(dur);
        const prEl = $('#prog');
        if (prEl) prEl.max = P.dur;
      }
    } else if (P.provider === 'direct') {
      const vid = document.getElementById('html5Vid');
      if (vid && !vid.paused) {
        P.pos = vid.currentTime;
        if (vid.duration) P.dur = Math.floor(vid.duration);
      }
    } else {
      P.pos = Math.min(P.dur, P.pos + 0.25 * P.speed);
    }

    if (P.pos >= P.dur) {
      P.on = false;
      saveLessonProgress(P.lessonId, P.dur, true);
    } else if (Math.floor(P.pos) % 5 === 0) {
      saveLessonProgress(P.lessonId, P.pos, P.pos >= P.dur * 0.85);
    }
    upd();
  }, 250);

  // تحريك العلامة المائية عشوائياً + فحص عدم التلاعب بها
  wmT = setInterval(() => {
    const w = $('#wm'), g = $('#wmGhost'), sc = $('#scr');
    if (!sc || !P) return;
    if (!w || !sc.contains(w) || w.textContent !== P.wmText || getComputedStyle(w).display === 'none' || parseFloat(getComputedStyle(w).opacity) < 0.15) {
      triggerTamperLock('تم اكتشاف محاولة إخفاء أو تعديل العلامة المائية الأمنية.');
      return;
    }
    w.style.top = (10 + Math.random() * 68) + '%';
    w.style.left = (6 + Math.random() * 54) + '%';
    if (g) {
      g.style.bottom = (8 + Math.random() * 70) + '%';
      g.style.right = (8 + Math.random() * 60) + '%';
    }
  }, 3200);

  setupWatermarkMutationGuard();
}

function initMediaController() {
  if (!P) return;
  if (P.provider === 'direct') {
    const vid = document.getElementById('html5Vid');
    if (vid) {
      vid.currentTime = P.pos;
      vid.play().catch(() => {});
    }
  } else if (P.provider === 'youtube' && P.videoId) {
    if (!window.YT || !window.YT.Player) {
      if (!document.getElementById('ytApiScript')) {
        const tag = document.createElement('script');
        tag.id = 'ytApiScript';
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);
      }
      window.onYouTubeIframeAPIReady = () => createYtInstance();
    } else {
      createYtInstance();
    }
  }
}

function createYtInstance() {
  if (!P || P.provider !== 'youtube' || !document.getElementById('ytMount')) return;
  ytPlayer = new window.YT.Player('ytMount', {
    videoId: P.videoId,
    playerVars: {
      autoplay: 1,
      controls: 0,
      disablekb: 1,
      fs: 0,
      iv_load_policy: 3,
      modestbranding: 1,
      rel: 0,
      showinfo: 0,
      start: Math.floor(P.pos),
      origin: window.location.origin !== 'null' ? window.location.origin : 'https://shadi-platform.local'
    },
    events: {
      onReady: (e) => {
        if (P && P.pos > 0) e.target.seekTo(P.pos, true);
        e.target.playVideo();
      },
      onStateChange: (e) => {
        if (!P) return;
        if (e.data === 1) { P.on = true; upd(); }
        else if (e.data === 2 || e.data === 0) { P.on = false; upd(); }
      }
    }
  });
}

/**
 * مراقب الحماية الحيّ (MutationObserver) لمنع حذف العلامة المائية من Inspect Element
 */
function setupWatermarkMutationGuard() {
  const sc = $('#scr');
  if (!sc || typeof MutationObserver === 'undefined') return;
  wmObserver = new MutationObserver(() => {
    const w = $('#wm');
    if (!P) return;
    if (!w || !sc.contains(w) || w.textContent !== P.wmText) {
      triggerTamperLock('تم إيقاف المشغل بسبب محاولة حذف العلامة المائية من المتصفح.');
    }
  });
  wmObserver.observe(sc, { childList: true, subtree: true, attributes: true, characterData: true });
}

function triggerTamperLock(reason) {
  if (!P) return;
  P.on = false;
  if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') { try { ytPlayer.pauseVideo(); } catch (e) {} }
  const vid = document.getElementById('html5Vid');
  if (vid) vid.pause();
  const sc = $('#scr'), msg = $('#secMsg');
  if (sc) sc.classList.add('tampered');
  if (msg) msg.textContent = reason;
  upd();
}

function upd() {
  if (!P) return;
  const pr = $('#prog'), tm = $('#tm'), sc = $('#scr'), b = $('#ppb'), spd = $('#spdBtn');
  if (!pr) return;
  pr.value = P.pos;
  tm.textContent = `${fmtT(P.pos)} / ${fmtT(P.dur)}`;
  sc.classList.toggle('on', P.on);
  b.innerHTML = P.on ? I.pause : I.play;
  b.setAttribute('aria-label', P.on ? 'إيقاف مؤقت' : 'تشغيل');
  if (spd) spd.textContent = P.speed + 'x';
}

function togglePlayPause() {
  if (!P) return;
  if (P.pos >= P.dur) P.pos = 0;
  P.on = !P.on;
  if (P.provider === 'youtube' && ytPlayer && typeof ytPlayer.playVideo === 'function') {
    if (P.on) ytPlayer.playVideo(); else ytPlayer.pauseVideo();
  } else if (P.provider === 'direct') {
    const vid = document.getElementById('html5Vid');
    if (vid) { if (P.on) vid.play(); else vid.pause(); }
  }
  upd();
}

function seekPlayer(targetSec) {
  if (!P) return;
  P.pos = Math.max(0, Math.min(P.dur, targetSec));
  if (P.provider === 'youtube' && ytPlayer && typeof ytPlayer.seekTo === 'function') {
    ytPlayer.seekTo(P.pos, true);
  } else if (P.provider === 'direct') {
    const vid = document.getElementById('html5Vid');
    if (vid) vid.currentTime = P.pos;
  }
  upd();
}

function cycleSpeed() {
  if (!P) return;
  const speeds = [1, 1.25, 1.5, 2];
  const next = speeds[(speeds.indexOf(P.speed) + 1) % speeds.length];
  P.speed = next;
  if (P.provider === 'youtube' && ytPlayer && typeof ytPlayer.setPlaybackRate === 'function') {
    ytPlayer.setPlaybackRate(next);
  } else if (P.provider === 'direct') {
    const vid = document.getElementById('html5Vid');
    if (vid) vid.playbackRate = next;
  }
  toast(`سرعة التشغيل: ${next}x`);
  upd();
}

function toggleFullscreen() {
  const sc = $('#scr');
  if (!sc) return;
  if (!document.fullscreenElement) {
    (sc.requestFullscreen || sc.webkitRequestFullscreen || function(){}).call(sc);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
  }
}

function startSub(d) {
  if (d.plan) sub.plan = d.plan;
  if (d.subj && d.subj !== 'both') sub.subj = d.subj;
  if (!S.user) { after = 'sub'; authM('signup'); return; }
  sub.tab = 'pay';
  subM();
}

/* ============================================================================
 * 6. حماية المتصفح ضد اختصارات النسخ والتصوير وفقدان التركيز
 * ============================================================================ */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !modal.hidden) { closeM(); return; }
  // منع F12 و Ctrl+Shift+I/J/C و Ctrl+U/S
  if (
    e.key === 'F12' ||
    (e.ctrlKey && e.shiftKey && ['I', 'i', 'J', 'j', 'C', 'c'].includes(e.key)) ||
    (e.ctrlKey && ['U', 'u', 'S', 's'].includes(e.key))
  ) {
    e.preventDefault();
    toast('🛡️ أدوات فحص الكود وحفظ الصفحة معطّلة لحماية المحتوى التعليمي');
    return false;
  }
  if (e.key === 'PrintScreen') {
    if (P) triggerTamperLock('تم إيقاف الفيديو مؤقتاً لمنع التقاط الشاشة.');
    toast('🛡️ تصوير الشاشة غير مسموح به');
  }
});

window.addEventListener('blur', () => {
  if (P && P.on && P.provider !== 'drive') {
    P.on = false;
    if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') { try { ytPlayer.pauseVideo(); } catch (e) {} }
    const sc = $('#scr');
    if (sc) sc.classList.add('blurred');
    upd();
  }
});

/* ============================================================================
 * 7. معالجة النقرات والأحداث والنماذج
 * ============================================================================ */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const d = b.dataset;

  switch (d.act) {
    case 'view':
      S.view = d.view;
      closeM();
      render();
      window.scrollTo(0, 0);
      break;
    case 'subj':
      S.subj = d.subj;
      render();
      break;
    case 'play':
      playM(d.subj, d.id);
      break;
    case 'locked':
      lockedM(d.subj, d.id);
      break;
    case 'auth':
      if (d.next) after = d.next;
      if (d.subj) sub.subj = d.subj;
      authM(d.mode);
      break;
    case 'logout':
      S.user = null;
      S.token = '';
      S.view = 'student';
      saveState();
      render();
      toast('تم تسجيل الخروج بنجاح');
      break;
    case 'mine':
      mineM();
      break;
    case 'sub':
      startSub(d);
      break;
    case 'pk':
      sub.plan = d.plan;
      subM();
      break;
    case 'ptab':
      sub.tab = d.tab;
      subM();
      break;
    case 'copy':
      e.preventDefault();
      try {
        navigator.clipboard.writeText(d.v).then(() => toast('تم النسخ: ' + d.v), () => toast('الرقم: ' + d.v));
      } catch (_) {
        toast('الرقم: ' + d.v);
      }
      break;
    case 'send': {
      const txEl = $('#txRefIn'), er = $('#payErr');
      const txRef = (txEl ? txEl.value : '').trim();
      sub.txRef = txRef;
      if (txRef.length < 4) {
        if (er) er.textContent = 'يرجى إدخال رقم عملية التحويل الموجود في الإشعار (4 خانات على الأقل).';
        break;
      }
      // فحص عدم تكرار رقم عملية التحويل لمنع الغش
      const normRef = txRef.toUpperCase().replace(/\s+/g, '');
      const dup = S.requests.find(r => r.st !== 'no' && String(r.txRef || '').toUpperCase().replace(/\s+/g, '') === normRef);
      if (dup) {
        if (er) er.textContent = '⚠️ رقم عملية التحويل هذا مستخدم مسبقاً! لا يمكن إرسال نفس الإشعار مرتين.';
        break;
      }
      const p = plan(sub.plan);
      const r = {
        id: ++uid,
        sid: S.user.id,
        plan: p.id,
        subj: p.both ? 'both' : sub.subj,
        method: S.wallets[sub.w].n,
        txRef: txRef,
        amount: S.prices[p.id],
        at: Date.now(),
        st: 'pending',
        receipt: sub.file
      };
      S.requests.unshift(r);
      sub.file = null;
      sub.txRef = '';
      saveState();
      if (API_URL) callGasApi('sub.request', r).catch(() => {});
      render();
      doneM(
        'تم إرسال طلبك بنجاح',
        'سيراجع الأستاذ إشعار الدفع ورقم العملية، وتُفتح الدروس في حسابك فور الموافقة.',
        'للتجربة الآن: افتح «لوحة تحكم المدرّس» واقبل الطلب، ثم ارجع لواجهة الطالب لترى الدروس مفتوحة.'
      );
      break;
    }
    case 'redeem': {
      const v = ($('#codeIn').value || '').trim().toUpperCase(), c = S.codes.find(x => x.c === v), er = $('#codeErr');
      if (!c) { er.textContent = 'الكود غير صحيح، تأكد منه وأعد المحاولة.'; break; }
      if (c.used) { er.textContent = 'هذا الكود مستخدم من قبل ولا يمكن تفعيله مرتين.'; break; }
      c.used = true;
      c.by = S.user.name;
      grant(S.user, c.subj, c.mo);
      if (API_URL) callGasApi('sub.redeem', { code: v }).catch(() => {});
      render();
      doneM('تم تفعيل اشتراكك بنجاح', `فُتحت دروس ${subjName(c.subj)} حتى ${fmtD(S.user.subs[c.subj === 'both' ? 'math' : c.subj])}.`);
      break;
    }
    case 'close':
      closeM();
      break;
    case 'pp':
      togglePlayPause();
      break;
    case 'seek':
      if (P) seekPlayer(P.pos + Number(d.d));
      break;
    case 'speed':
      cycleSpeed();
      break;
    case 'fs':
      toggleFullscreen();
      break;
    case 'resumeSec': {
      const sc = $('#scr');
      if (sc) {
        sc.classList.remove('blurred', 'tampered');
        if (!$('#wm') && P) {
          const w = document.createElement('div');
          w.className = 'wm';
          w.id = 'wm';
          w.textContent = P.wmText;
          sc.appendChild(w);
        }
      }
      if (P) { P.on = true; if (ytPlayer && ytPlayer.playVideo) ytPlayer.playVideo(); upd(); }
      break;
    }
    case 'atab':
      S.tab = d.tab;
      render();
      break;
    case 'rf':
      S.rf = d.f;
      render();
      break;
    case 'as':
      S.as = d.subj;
      render();
      break;
    case 'rimg': {
      const r = S.requests.find(x => x.id === Number(d.id));
      openM(`<h3>إشعار الدفع · ${esc(stu(r.sid).name)} <small class="muted">(#${esc(r.txRef || r.id)})</small></h3><img class="big" src="${rimg(r)}" alt="إشعار الدفع">`);
      break;
    }
    case 'appr':
    case 'rej': {
      const r = S.requests.find(x => x.id === Number(d.id)), s = stu(r.sid);
      if (d.act === 'appr') {
        r.st = 'ok';
        grant(s, r.subj, plan(r.plan).mo);
        toast(`تم قبول اشتراك ${s.name} وفُتحت دروسه`);
      } else {
        r.st = 'no';
        saveState();
        toast(`تم رفض طلب ${s.name}`);
      }
      if (API_URL) callGasApi('admin.request.decide', { id: r.id, approve: d.act === 'appr' }).catch(() => {});
      render();
      break;
    }
    case 'stop': {
      const s = stu(Number(d.id));
      s.subs = {};
      saveState();
      render();
      toast(`تم إيقاف اشتراك ${s.name}`);
      break;
    }
    case 'give': {
      const s = stu(Number(d.id));
      grant(s, 'both', 1);
      render();
      toast(`تم تفعيل شهر للمادتين لـ ${s.name}`);
      break;
    }
    case 'resetDev': {
      const s = stu(Number(d.id));
      s.deviceFp = '';
      s.deviceLabel = '';
      s.deviceAlerts = 0;
      saveState();
      if (API_URL) callGasApi('admin.student.resetDevice', { id: s.id }).catch(() => {});
      render();
      toast(`🔓 تم فك قفل الجهاز للطالب ${s.name}؛ يمكنه الآن الدخول من جهازه الجديد`);
      break;
    }
    case 'blockStu': {
      const s = stu(Number(d.id));
      s.status = s.status === 'blocked' ? 'active' : 'blocked';
      if (S.user && S.user.id === s.id && s.status === 'blocked') S.user = null;
      saveState();
      render();
      toast(s.status === 'blocked' ? `🚫 تم حظر حساب ${s.name}` : `✅ تم إعادة تفعيل حساب ${s.name}`);
      break;
    }
    case 'editL':
      editLessonM(d.subj, d.id);
      break;
    case 'delL': {
      const k = d.subj, id = d.id;
      L[k] = L[k].filter(x => x.id !== id);
      saveState();
      closeM();
      toast('تم حذف الدرس');
      break;
    }
    case 'resetDemo':
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
      break;
  }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;

  if (f.id === 'authF') {
    const su = f.dataset.mode === 'signup';
    const name = su ? $('#fName').value.trim() : '';
    const ph = $('#fPhone').value.trim();
    const normPh = digits(ph);
    const pw = $('#fPass').value;
    const er = $('#authErr');

    if (su && name.length < 3) { er.textContent = 'اكتب اسمك الكامل (3 أحرف على الأقل).'; return; }
    if (normPh.length < 9) { er.textContent = 'اكتب رقم جوال صحيح.'; return; }
    if (pw.length < 4) { er.textContent = 'كلمة المرور 4 أحرف أو أرقام على الأقل.'; return; }

    // فحص دخول الأستاذ (المدير)
    if (!su && normPh === digits(S.adminPhone) && pw === S.adminPass) {
      S.user = { id: 0, name: 'الأستاذ شادي عبيد', phone: S.adminPhone, role: 'admin', subs: { math: now + 3650 * DAY, phys: now + 3650 * DAY } };
      saveState();
      closeM();
      toast('أهلاً بك أستاذ شادي — تم تفعيل صلاحيات الإدارة');
      return;
    }

    if (su) {
      if (S.students.some(s => digits(s.phone) === normPh) || normPh === digits(S.adminPhone)) {
        er.textContent = 'هذا الرقم مسجّل مسبقاً، سجّل الدخول بدلاً من ذلك.';
        return;
      }
      const s = {
        id: ++uid,
        name,
        phone: ph,
        pass: pw,
        role: 'student',
        subs: {},
        deviceFp: MY_DEVICE_FP,
        deviceLabel: MY_DEVICE_LABEL,
        deviceAlerts: 0,
        status: 'active',
        joined: Date.now()
      };
      S.students.unshift(s);
      S.user = s;
      saveState();
      toast('أهلاً ' + name.split(' ')[0] + '، تم إنشاء حسابك وربطه بجهازك');
    } else {
      const s = S.students.find(x => digits(x.phone) === normPh);
      if (!s) { er.textContent = 'لا يوجد حساب مسجّل بهذا الرقم.'; return; }
      if (s.status === 'blocked') { er.textContent = 'تم إيقاف هذا الحساب من قِبل الإدارة.'; return; }
      if (s.pass && s.pass !== pw) { er.textContent = 'كلمة المرور غير صحيحة.'; return; }

      // التحقق من بصمة الجهاز (منع فتح الحساب على أجهزة أخرى)
      const savedFps = String(s.deviceFp || '').split('|').filter(Boolean);
      if (savedFps.length > 0 && !savedFps.includes(MY_DEVICE_FP)) {
        if (savedFps.length >= (S.maxDevices || 1)) {
          s.deviceAlerts = (s.deviceAlerts || 0) + 1;
          saveState();
          er.textContent = `🔒 هذا الحساب مرتبط بجهاز آخر (${s.deviceLabel || 'هاتف آخر'}). لمنع مشاركة الحسابات لا يُسمح بالدخول من جهاز جديد إلا بعد فك الارتباط من الأستاذ.`;
          return;
        } else {
          savedFps.push(MY_DEVICE_FP);
          s.deviceFp = savedFps.join('|');
          s.deviceLabel = (s.deviceLabel ? s.deviceLabel + ' + ' : '') + MY_DEVICE_LABEL;
        }
      } else if (savedFps.length === 0) {
        s.deviceFp = MY_DEVICE_FP;
        s.deviceLabel = MY_DEVICE_LABEL;
      }

      S.user = s;
      saveState();
      toast('أهلاً بعودتك ' + s.name.split(' ')[0]);
    }

    render();
    if (after === 'sub') { after = null; sub.tab = 'pay'; subM(); }
    else closeM();
    return;
  }

  if (f.id === 'addL') {
    const k = $('#nS').value, d = $('#nD').value.trim(), vUrl = $('#nV').value.trim();
    if (!/^\d{1,2}:\d{2}$/.test(d)) { toast('اكتب المدة بالشكل 12:30'); return; }
    const pv = parseVideoUrl(vUrl);
    L[k].push({
      id: 'n' + (++uid),
      u: $('#nU').value.trim(),
      t: $('#nT').value.trim(),
      d: d.padStart(5, '0'),
      free: $('#nFree').checked,
      f: $('#nF').value.trim() || '…',
      provider: pv.provider,
      videoSource: vUrl,
      pdfUrl: $('#nPdf').value.trim(),
      v: 0
    });
    S.as = k;
    saveState();
    render();
    toast('تمت إضافة الدرس بنجاح وظهر للطلاب');
    return;
  }

  if (f.id === 'editLF') {
    const k = f.dataset.subj, id = f.dataset.id;
    const l = L[k].find(x => x.id === id);
    if (l) {
      l.t = $('#eT').value.trim();
      l.u = $('#eU').value.trim();
      l.d = $('#eD').value.trim();
      l.videoSource = $('#eV').value.trim();
      l.provider = parseVideoUrl(l.videoSource).provider;
      l.f = $('#eF').value.trim() || '…';
      l.pdfUrl = $('#ePdf').value.trim();
      saveState();
      closeM();
      toast('تم تحديث بيانات ورابط الدرس بنجاح');
    }
    return;
  }

  if (f.id === 'genC') {
    const n = Math.min(20, Math.max(1, Number($('#cN').value) || 1));
    const ch = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
    const r = m => Array.from({ length: m }, () => ch[Math.floor(Math.random() * ch.length)]).join('');
    for (let i = 0; i < n; i++) {
      S.codes.unshift({ c: `SH-${r(4)}-${r(2)}`, subj: $('#cS').value, mo: Number($('#cM').value), used: false });
    }
    saveState();
    render();
    toast(`تم توليد ${pl(n, 'كود واحد', 'كودين', 'أكواد', 'كودًا')}`);
    return;
  }

  if (f.id === 'setF') {
    PLANS.forEach(p => {
      const v = Number($('#pr_' + p.id).value);
      if (v >= 0) S.prices[p.id] = v;
    });
    S.wallets.forEach((w, i) => { w.v = $('#w_' + i).value.trim() || w.v; });
    S.wa = $('#waN').value.trim() || S.wa;
    S.maxDevices = Number($('#maxDev').value) || 1;
    if ($('#admPass').value.trim().length >= 4) S.adminPass = $('#admPass').value.trim();
    const gasInput = $('#gasUrl').value.trim();
    API_URL = gasInput;
    localStorage.setItem('SHADI_GAS_API_URL', API_URL);
    saveState();
    render();
    toast('تم حفظ الإعدادات وتحديث قواعد الحماية');
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'sSubj') sub.subj = t.value;
  else if (t.name === 'wal') sub.w = Number(t.value);
  else if (t.id === 'rcpt' && t.files[0]) {
    if ($('#txRefIn')) sub.txRef = $('#txRefIn').value.trim();
    const rd = new FileReader();
    rd.onload = () => { sub.file = rd.result; subM(); };
    rd.readAsDataURL(t.files[0]);
  } else if (t.classList.contains('frt')) {
    const l = L[t.dataset.subj].find(x => x.id === t.dataset.id);
    l.free = t.checked;
    t.nextElementSibling.textContent = l.free ? 'مجاني' : 'مقفل';
    saveState();
    toast(`«${l.t}» أصبح ${l.free ? 'مجانيًا للجميع' : 'للمشتركين فقط'}`);
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'q') {
    S.q = e.target.value;
    const tb = $('#stuT tbody');
    if (tb) tb.innerHTML = stuRows();
  } else if (e.target.id === 'prog' && P) {
    seekPlayer(Number(e.target.value));
  } else if (e.target.id === 'txRefIn') {
    sub.txRef = e.target.value;
  }
});

modal.addEventListener('click', e => { if (e.target === modal) closeM(); });
render();
}
</script>
</body>
</html>
